name: CI Pipeline

on:
  push:
    branches: [feature/backend, feature/frontend, dev]
  pull_request:
    branches: [dev, main]

jobs:
  backend-ci:
    name: Backend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install
        working-directory: backend

      - name: Lint code
        run: ./node_modules/.bin/eslint src/**/*.js
        working-directory: backend

      - name: Run tests
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --passWithNoTests
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}